<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PMBSI HRIS · Meeting UI Preview</title>
<link rel="shortcut icon" href="../favicon.ico?v=20260924-full-wordmark" type="image/x-icon"><link rel="icon" type="image/png" sizes="32x32" href="assets/branding/favicon-32x32.png?v=20260924-full-wordmark"><link rel="apple-touch-icon" href="assets/branding/apple-touch-icon.png?v=20260924-full-wordmark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css"><link rel="stylesheet" href="assets/hris-modern.css">
<style>
body{margin:0}.preview-ribbon{position:relative}.preview-ribbon strong{font-weight:700}.preview-note{color:#858d98}.preview-switcher{margin-left:18px}.preview-switcher button{cursor:pointer}.preview-screen .side{top:42px;height:calc(100vh - 42px)}.preview-screen .topbar{top:42px}.preview-screen .content{padding-top:28px}
@media(max-width:900px){.preview-switcher{margin-left:4px}.preview-ribbon{justify-content:flex-start;padding:0 10px;overflow-x:auto}.preview-note{display:none}}
</style>
</head>
<body>
<div class="preview-shell">
  <div class="preview-ribbon"><span class="sample">Meeting UI Preview</span><strong>PMBSI HRIS</strong><span class="preview-note">Sample data for design presentation</span><div class="preview-switcher"><a href="home-preview.html" class="btn sm" style="height:28px;padding:4px 9px;margin-right:4px">Public Home</a><button data-role="employee">Employee</button><button data-role="hr" class="active">HR</button><button data-role="admin">HR Admin</button></div></div>
  <div id="preview" class="preview-screen"></div>
</div>
<script>
const icons={
 home:'<path d="M3 10.8 12 3l9 7.8"/><path d="M5.5 9.4V21h13V9.4"/><path d="M9.5 21v-6h5v6"/>',
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
 user:'<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',briefcase:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',
 chart:'<path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/>',shield:'<path d="M12 22s8-3.5 8-10V5l-8-3-8 3v7c0 6.5 8 10 8 10Z"/><path d="m9 12 2 2 4-5"/>',building:'<path d="M3 21h18M6 21V5l6-2v18M18 21V9l-6-2"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9 7 7M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',bell:'<path d="M18 8a6 6 0 1 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/>',moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>',
 check:'<path d="m5 12 4 4L19 6"/>',clipboard:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4.5V3h6v1.5M9 9h6M9 13h6M9 17h4"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/><path d="M8 7h8M8 11h6"/>',alert:'<path d="M10.3 3.5 2.5 17a2 2 0 0 0 1.73 3h15.54A2 2 0 0 0 21.5 17L13.7 3.5a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>'
};
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.home}</svg>`;
const data={
 employee:{name:'Juan Dela Cruz',role:'Employee',sub:'Employee Self-Service',groups:[['Overview',[['Home','home',1]]],['My Workspace',[['My Profile','user'],['Attendance','clock'],['Leave','calendar'],['Requests','clipboard']]],['Growth',[['Performance','chart'],['Training','book']]]]},
 hr:{name:'Andrea Domingo',role:'Recruitment Manager',sub:'Human Resources',groups:[['Overview',[['Dashboard','home',1]]],['People',[['Employees','users'],['Attendance','clock'],['Leave','calendar'],['HR Requests','clipboard']]],['Recruitment',[['Manpower Requests','briefcase'],['Applicants','users'],['Pipeline','chart'],['Endorsements','check']]],['HR Operations',[['Employee Relations','shield'],['Performance','chart'],['Training','book']]],['Insights',[['Reports','chart']]]]},
 admin:{name:'Winston Cruz',role:'HRIS Administrator',sub:'HR Administration',groups:[['Overview',[['Dashboard','home',1]]],['Access Control',[['Users','users'],['Roles & Permissions','shield'],['Security','shield']]],['Organization',[['Departments','building'],['Positions','briefcase'],['Branches','building']]],['System',[['Audit Logs','file'],['Settings','settings']]] ]}
};
function nav(role){const d=data[role];return `<aside class="side"><div class="brand brand-portal"><img src="assets/branding/pmbsi-mark.png" alt="" class="brand-mark"><span>PMBSI HRIS<span class="sub">${d.sub}</span></span></div><div class="navs">${d.groups.map(g=>`<div class="nav-group"><div class="gl">${g[0]}</div>${g[1].map(x=>`<div class="nav-item ${x[2]?'active':''}"><span class="ni">${svg(x[1])}</span><span>${x[0]}</span></div>`).join('')}</div>`).join('')}</div><div class="prof"><span class="avatar">${d.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><div><div class="small" style="font-weight:650;color:#f2f4f7">${d.name}</div><div class="tiny muted">${d.role}</div></div></div></aside>`}
function topbar(role){const d=data[role];return `<div class="topbar"><div class="search">${svg('search')}<input placeholder="${role==='employee'?'Search your HRIS…':role==='hr'?'Search employees, applicants, requests…':'Search users, branches, settings…'}"></div><div class="topbar-actions"><div class="topbar-date"><strong>Thu, Sep 24</strong>10:02 AM</div><button class="iconbtn notify-btn">${svg('bell')}</button><button class="iconbtn">${svg('moon')}</button><button class="profile-trigger"><span class="avatar">${d.name.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><span class="ptxt"><strong>${d.name}</strong><span>${d.role}</span></span></button></div></div>`}
const metric=(l,v,f,i)=>`<div class="metric-card"><div class="metric-top"><div class="metric-label">${l}</div><div class="metric-icon">${svg(i)}</div></div><div class="metric-value">${v}</div><div class="metric-foot">${f}</div></div>`;
const attention=(t,s,c,tone,i)=>`<div class="attention-item"><div class="attention-icon ${tone}">${svg(i)}</div><div class="txt"><strong>${t}</strong><span>${s}</span></div><div class="count">${c}</div></div>`;
function employee(){return `<div class="content"><div class="dashboard-hero"><div><div class="eyebrow">Employee self-service</div><h1>Good morning, Juan.</h1><p>Your personal HR workspace for today.</p></div><div class="hero-actions"><button class="btn">View profile</button><button class="btn primary">${svg('calendar')} Apply leave</button></div></div><div class="employee-focus"><section class="panel today-card"><div class="panel-head"><div><h2>Today</h2><p>Thursday · September 24, 2026</p></div><span class="status-pill">On time</span></div><div class="today-time"><div><div class="big">08:47 AM</div><div class="smallline">Time in · Schedule 9:00 AM — 6:00 PM</div></div><div style="text-align:right"><div class="smallline">Work location</div><strong style="font-size:13px">PMBSI Head Office</strong></div></div></section><section class="panel"><div class="panel-head"><div><h2>Leave balance</h2><p>Available credits</p></div></div><div class="panel-body"><div class="balance-grid"><div class="balance-card"><strong>5.0</strong><span>Vacation leave</span></div><div class="balance-card"><strong>4.0</strong><span>Sick leave</span></div></div></div></section></div><div class="dashboard-grid equal"><section class="panel"><div class="panel-head"><div><h2>Quick actions</h2><p>Common employee requests</p></div></div><div class="panel-body"><div class="quick-actions">${[['Apply for leave','Submit and track requests','calendar'],['Attendance correction','Request time adjustment','clock'],['Request COE','Employment document request','file'],['HR request','Send a concern to HR','clipboard']].map(x=>`<div class="quick-action"><span class="qa-icon">${svg(x[2])}</span><span><strong>${x[0]}</strong><span>${x[1]}</span></span></div>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Upcoming</h2><p>Your next HR activities</p></div></div><div class="panel-body"><div class="timeline-list">${[['Sep 27','Workplace Safety Training','10:00 AM · Training Room'],['Oct 02','Performance Check-in','With immediate supervisor'],['Oct 15','Document renewal','Government ID record']].map(x=>`<div class="timeline-row"><div class="time">${x[0]}</div><span class="timeline-dot"></span><div class="detail"><strong>${x[1]}</strong><span>${x[2]}</span></div></div>`).join('')}</div></div></section></div></div>`}
function hr(){let bars=[58,84,110,70,94,52,31,18];return `<div class="content"><div class="dashboard-hero"><div><div class="eyebrow">Human Resources</div><h1>Good morning, Andrea.</h1><p>Here’s your workforce and recruitment overview for today.</p></div><div class="hero-actions"><button class="btn">+ New employee</button><button class="btn primary">Open recruitment pipeline</button></div></div><div class="metric-grid">${metric('Total employees','428','↑ 12 this month','users')}${metric('Present today','376','87.9% attendance','check')}${metric('Late today','31','Needs monitoring','clock')}${metric('Pending leave','12','Awaiting HR action','calendar')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>Workforce pulse</h2><p>Attendance trend for the last 8 workdays</p></div><span class="panel-link">View attendance</span></div><div class="panel-body"><div class="pulse-bars">${bars.map((h,i)=>`<div class="col"><div class="bar" style="height:${h}px"></div><div class="label">${['M','T','W','T','F','M','T','W'][i]}</div></div>`).join('')}</div><div class="legend-row"><span><i class="legend-dot" style="background:var(--hris-brand)"></i>Attendance rate</span><span>94% average this period</span></div></div></section><section class="panel"><div class="panel-head"><div><h2>Requires attention</h2><p>Priority HR items</p></div></div><div class="panel-body"><div class="attention-list">${attention('Attendance corrections','Pending employee requests','7','warn','clock')}${attention('Expiring contracts','Within the next 30 days','3','danger','file')}${attention('Incomplete documents','Employee 201 file requirements','5','info','file')}${attention('Open positions','Active manpower requests','13','success','briefcase')}</div></div></section></div><div class="dashboard-grid equal"><section class="panel"><div class="panel-head"><div><h2>Recruitment today</h2><p>Pipeline activity</p></div><span class="panel-link">Open recruitment</span></div><div class="panel-body"><div class="quick-actions">${[['46','Active applicants','users'],['18','For interview','calendar'],['9','Client review','check'],['6','For deployment','briefcase']].map(x=>`<div class="quick-action"><span class="qa-icon">${svg(x[2])}</span><span><strong style="font-size:16px">${x[0]}</strong><span>${x[1]}</span></span></div>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Quick actions</h2><p>Start common HR workflows</p></div></div><div class="panel-body"><div class="quick-actions">${[['Employee directory','Open 201 files','users'],['Attendance','Review today','clock'],['Leave requests','12 pending','calendar'],['HR reports','View analytics','chart']].map(x=>`<div class="quick-action"><span class="qa-icon">${svg(x[2])}</span><span><strong>${x[0]}</strong><span>${x[1]}</span></span></div>`).join('')}</div></div></section></div></div>`}
function admin(){return `<div class="content"><div class="dashboard-hero"><div><div class="eyebrow">HR Administration</div><h1>Organization overview</h1><p>System access, organization structure and HRIS health in one place.</p></div><div class="hero-actions"><button class="btn">Manage roles</button><button class="btn primary">View audit activity</button></div></div><div class="metric-grid">${metric('User accounts','486','12 roles configured','users')}${metric('Departments','11','Organization structure','building')}${metric('Branches','24','Active locations','building')}${metric('Active sessions','38','Secure sessions','shield')}</div><div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><h2>System activity</h2><p>Latest audited actions</p></div><span class="panel-link">Audit logs</span></div><div class="panel-body"><div class="timeline-list">${[['09:41','Employee record updated','Andrea Domingo · HR'],['09:37','New HR user created','Winston Cruz · Admin'],['09:28','Leave request approved','Camille Ledesma · HR'],['09:14','Applicant converted to employee','Rafael Villamor · Recruitment'],['08:58','Role permission updated','Winston Cruz · Admin']].map(x=>`<div class="timeline-row"><div class="time">${x[0]}</div><span class="timeline-dot"></span><div class="detail"><strong>${x[1]}</strong><span>${x[2]}</span></div></div>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><h2>System health</h2><p>Core HRIS controls</p></div></div><div class="panel-body"><div class="attention-list">${attention('Authentication','Session security active','Healthy','success','shield')}${attention('Audit logging','All tracked actions recorded','Active','success','file')}${attention('Database','MySQL connection','Online','success','building')}${attention('Backups','Last backup 2 hours ago','Current','info','file')}</div></div></section></div><div class="dashboard-grid equal"><section class="panel"><div class="panel-head"><div><h2>Administration center</h2><p>Core configuration</p></div></div><div class="panel-body"><div class="quick-actions">${[['Users & access','Accounts and permissions','users'],['Organization','Departments and branches','building'],['Security','Sessions and login history','shield'],['Settings','HRIS configuration','settings']].map(x=>`<div class="quick-action"><span class="qa-icon">${svg(x[2])}</span><span><strong>${x[0]}</strong><span>${x[1]}</span></span></div>`).join('')}</div></div></section><section class="panel"><div class="panel-head"><div><h2>Workforce configuration</h2><p>Current organization setup</p></div></div><div class="panel-body"><div class="attention-list">${attention('Employment types','Regular, probationary, contractual','5','info','briefcase')}${attention('Positions','Configured job titles','74','info','briefcase')}${attention('Leave types','Active leave policies','6','info','calendar')}${attention('Departments','Configured business units','11','info','building')}</div></div></section></div></div>`}
function render(role){const body=role==='employee'?employee():role==='admin'?admin():hr();document.getElementById('preview').innerHTML=`<div class="shell">${nav(role)}<div class="main">${topbar(role)}${body}</div></div>`;document.querySelectorAll('.preview-switcher button').forEach(b=>b.classList.toggle('active',b.dataset.role===role));if(location.protocol!=='about:')history.replaceState(null,'',`?role=${role}`)}
document.querySelectorAll('.preview-switcher button').forEach(b=>b.onclick=()=>render(b.dataset.role));const r=new URLSearchParams(location.search).get('role');render(['employee','hr','admin'].includes(r)?r:'hr');
</script>
</body></html>
